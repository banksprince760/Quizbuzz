<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        QuizBuzz
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <a
        href="{{ url_for('index') }}"
        class="logo"
    >
        ⚡ QuizBuzz
    </a>

    {% if session.get("user_id") %}

    <nav>

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('notes') }}">
            Notes
        </a>

        <a href="{{ url_for('leaderboard') }}">
            Leaderboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

    {% endif %}

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
