{% extends "base.html" %}

{% block title %}
Login - QuizBuzz
{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>
        ⚡ QuizBuzz
    </h1>

    <h2>
        Login
    </h2>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            Username or Email
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            type="submit"
            class="full-btn"
        >
            Login
        </button>

    </form>


    <p class="auth-bottom">

        Account nahi hai?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

{% endblock %}
