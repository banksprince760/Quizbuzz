{% extends "base.html" %}

{% block title %}
Register - QuizBuzz
{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>
        Create Account
    </h1>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            value="{{ name or '' }}"
            required
        >


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            value="{{ username or '' }}"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            value="{{ email or '' }}"
            required
        >


        <label>
            Mobile Number
        </label>

        <input
            type="tel"
            name="mobile"
            value="{{ mobile or '' }}"
            maxlength="10"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <button
            type="submit"
            class="full-btn"
        >
            Register
        </button>

    </form>


    <p class="auth-bottom">

        Already registered?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
