{% extends "base.html" %}

{% block title %}
Question {{ q_number }} - QuizBuzz
{% endblock %}

{% block content %}

<div class="quiz-card">

    <div class="quiz-meta">

        <span>
            {{ category_label }}
        </span>

        <span>
            {{ exam }}
        </span>

    </div>


    <div class="quiz-top">

        <p class="progress">

            Question
            {{ q_number }}
            /
            {{ total }}

        </p>


        <div
            class="timer-box"
            id="timerBox"
        >

            ⏱️

            <span id="timer">
                {{ time_limit }}
            </span>

            sec

        </div>

    </div>


    <h2 class="question-text">
        {{ question }}
    </h2>


    <form
        method="POST"
        id="quizForm"
    >

        <input
            type="hidden"
            name="timed_out"
            id="timedOut"
            value="0"
        >


        <div class="options-list">

            {% for option in options %}

            <label class="option-label">

                <input
                    type="radio"
                    name="option"
                    value="{{ option }}"
                >

                <span>
                    {{ option }}
                </span>

            </label>

            {% endfor %}

        </div>


        <button
            type="submit"
            class="full-btn"
            id="submitButton"
        >
            Submit Answer
        </button>

    </form>

</div>


<script>

let timeLeft =
    {{ time_limit | int }};

let submitted = false;

const timer =
    document.getElementById("timer");

const timerBox =
    document.getElementById("timerBox");

const quizForm =
    document.getElementById("quizForm");

const timedOut =
    document.getElementById("timedOut");

const submitButton =
    document.getElementById("submitButton");


const countdown = setInterval(
    function () {

        timeLeft--;

        timer.textContent =
            Math.max(
                timeLeft,
                0
            );

        if (timeLeft <= 1) {

            timerBox.classList.add(
                "timer-danger"
            );

        }

        if (
            timeLeft <= 0
            && !submitted
        ) {

            submitted = true;

            clearInterval(
                countdown
            );

            timedOut.value =
                "1";

            submitButton.disabled =
                true;

            quizForm.submit();

        }

    },
    1000
);


quizForm.addEventListener(
    "submit",
    function () {

        if (!submitted) {

            submitted = true;

            clearInterval(
                countdown
            );

            submitButton.disabled =
                true;

        }

    }
);

</script>

{% endblock %}
