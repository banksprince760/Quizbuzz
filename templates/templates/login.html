{% extends "base.html" %}

{% block title %}
Login - QuizBuzz
{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>🔐 Login</h1>

    <p class="subtitle">
        QuizBuzz mein login karein
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            class="full-btn"
        >
            Login
        </button>

    </form>

    <p class="auth-bottom">

        Account nahi hai?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

{% endblock %}
